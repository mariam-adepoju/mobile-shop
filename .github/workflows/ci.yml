name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same branch makes this run's jobs obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Tests must not inherit a developer's .env. These are the PRD 16 names and
    # none of them is secret (AGENTS.md 3.1).
    env:
      EXPO_PUBLIC_API_MODE: mock
      EXPO_PUBLIC_API_BASE_URL: https://daywell-shop.vercel.app/api/v1
      EXPO_PUBLIC_APP_SCHEME: daywell

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The lockfile pins an exact tree, so `npm ci` beats `npm install` for
      # catching a package.json edited without its lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test -- --ci

  # Probes the deployed backend so a missing /api/v1 slice is visible here
  # rather than during device testing (PRD 4.2).
  live-contract:
    name: Probe live API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The backend may not exist yet; never block CI on it.
    continue-on-error: true

    steps:
      - name: Probe GET /api/v1/health
        run: |
          status=$(curl -s -o /tmp/health.json -w '%{http_code}' \
            --max-time 15 https://daywell-shop.vercel.app/api/v1/health || echo 000)
          echo "GET /api/v1/health -> HTTP $status"
          cat /tmp/health.json || true
          exit 0
